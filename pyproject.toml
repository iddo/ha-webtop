[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E731", "RUF001", "RUF002", "RUF003"]  # Hebrew text trips the ambiguous-character rules

[tool.ruff.lint.isort]
known-first-party = ["custom_components.webtop"]
